name: Native desktop builds
on:
  push:
    # A version tag such as 0.1.3 (no "v": v-tags belong to the signed release workflow)
    # also publishes a GitHub release that installed copies update from.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
          - os: macos-15-intel
            target: mac-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run test:images
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Unsigned candidates are ad-hoc signed as a whole on macOS: without a sealed bundle,
      # Apple silicon Macs report the downloaded app as "damaged". Hardened runtime needs a
      # real Developer ID, so it stays off here (the signed release workflow keeps it on).
      - name: Package (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: npm run package -- -c.mac.identity=- -c.mac.hardenedRuntime=false
      - name: Package
        if: runner.os != 'macOS'
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:backend
      - name: Packaged Electron smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke-electron.mjs --packaged
      - name: Packaged Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-electron.mjs --packaged --no-sandbox
      - name: Packaged dual API and root recovery smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke-dual-api.mjs --packaged
      - name: About and overlap smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke-about.mjs --packaged
      - name: Packaged dual API and root recovery smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-dual-api.mjs --packaged --no-sandbox
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemez-${{ matrix.target }}-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: chemez-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'v')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: test "$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: chemez-*
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find out -path '*test-evidence*' -prune -o -type f -print -exec cp {} release/ \;
          rm -f release/latest-mac.yml
          cd release && sha256sum ChemEZ-* > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" * --title "ChemEZ ${{ github.ref_name }}" --generate-notes
