    <text x="832" y="278" fill="#DAE8DF" font-size="16" font-weight="600">Aspirin</text>
    <text x="1125" y="278" text-anchor="end" fill="#A4BEAE" font-size="15">C<tspan baseline-shift="sub" font-size="10">9</tspan><tspan baseline-shift="baseline">H</tspan><tspan baseline-shift="sub" font-size="10">8</tspan><tspan baseline-shift="baseline">O</tspan><tspan baseline-shift="sub" font-size="10">4</tspan></text>
