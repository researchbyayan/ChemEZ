    <text x="50" y="160" fill="#F0F7F2" font-size="53" font-weight="700" letter-spacing="-2.2">See the chemistry.</text>
    <text x="52" y="202" fill="#A8BCAF" font-size="21">Clear structures. Better explanations.</text>
    <text x="52" y="278" fill="#9CD9B0" font-size="11" font-weight="600" letter-spacing="1.8">MOLECULES  /  REACTIONS  /  MECHANISMS</text>
